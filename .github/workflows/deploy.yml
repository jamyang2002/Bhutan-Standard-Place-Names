name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Workflow-level permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Ensure this job runs against the github-pages environment so Pages shows the deployment
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: https://jamyang2002.github.io/Bhutan-Standard-Place-Names/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
